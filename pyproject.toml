[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analysis-service"
version = "0.1.0"
description = "A serverless log analysis service for monitoring and alerting"
authors = [
    {name = "Samira Amiri", email = "your-email@example.com"},
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.23",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"